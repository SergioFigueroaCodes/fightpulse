
spring.application.name=fightpulse

# Read the YouTube API key from the computer environment.
youtube.api.key=${YOUTUBE_API_KEY:}

# Prevent database queries while JSON responses are being created.
spring.jpa.open-in-view=false

# Do not include Java stack traces in API error responses.
server.error.include-stacktrace=never

# Save FightPulse data permanently on your computer.
spring.datasource.url=jdbc:h2:file:./data/fightpulse

# H2 database connection.
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Keep saved videos when the application restarts.
spring.jpa.hibernate.ddl-auto=update
